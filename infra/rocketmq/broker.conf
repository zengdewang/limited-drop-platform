# RocketMQ broker config (mounted to /home/rocketmq/broker.conf)
brokerClusterName = DefaultCluster
brokerName        = broker-a
brokerId          = 0
deleteWhen        = 04
fileReservedTime  = 48
brokerRole        = ASYNC_MASTER
flushDiskType     = ASYNC_FLUSH

autoCreateTopicEnable = true

# advertise the host-reachable address so local JVMs on Windows can connect
# (host localhost:10911 maps to this container). Change to your LAN IP for
# cross-machine access.
brokerIP1 = 127.0.0.1

# Delayed messages: default levels don't include 15m. Override so that
# level 15 == 15m (our Payment Window), level 14 == 10m (dev fast-expiry).
# Index: 1s(1) 5s(2) 10s(3) 30s(4) 1m(5) 2m(6) 3m(7) 4m(8) 5m(9) 6m(10)
#        7m(11) 8m(12) 9m(13) 10m(14) 15m(15) 20m(16) 30m(17) 1h(18) 2h(19)
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 15m 20m 30m 1h 2h
